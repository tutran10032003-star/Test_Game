<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subway Eco Runner 🏃‍♂️⚡</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #fcf8f2;
            color: #4a3b32;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            user-select: none;
        }
        .game-container {
            width: 100%;
            max-width: 400px;
            background: linear-gradient(145deg, #fffdfa, #f7f1e5);
            border: 3px solid #5c4738;
            box-shadow: 6px 6px 0 #5c4738;
            border-radius: 24px;
            padding: 20px;
            text-align: center;
        }
        .track-box {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            background: #2b3a42;
            border: 3px solid #5c4738;
            border-radius: 16px;
            padding: 12px;
            min-height: 280px;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.6);
            margin: 15px 0;
        }
        .lane {
            background: #1f2a30;
            border: 2px dashed #4b6270;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 8px 0;
            min-height: 250px;
            font-size: 32px;
        }
        .lane.active-lane {
            background: #26353d;
            border-color: #A8C7A0;
        }
        .control-btn {
            background: #A8C7A0;
            border: 2px solid #5c4738;
            color: #2b3a42;
            font-weight: 900;
            font-size: 18px;
            padding: 14px;
            border-radius: 16px;
            box-shadow: 0 4px 0 #5c4738;
            cursor: pointer;
            transition: all 0.05s ease;
        }
        .control-btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #5c4738;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <div class="flex justify-between items-center mb-2 px-2">
            <span class="font-black text-sm">🚇 SUBWAY ECO RUNNER</span>
            <span id="score-display" class="bg-[#364954] text-amber-300 px-3 py-1 rounded-full text-xs font-black border border-[#5c4738]">⭐ 0</span>
        </div>
        
        <p class="text-xs text-[#7a6452] font-bold">Né chướng ngại vật 🚧 và ăn ngôi sao ⭐!</p>

        <!-- Khung đường ray -->
        <div class="track-box" id="track-container">
            <!-- Render bằng Javascript -->
        </div>

        <!-- Nút điều khiển 2 bên -->
        <div class="grid grid-cols-2 gap-4 mt-3">
            <button class="control-btn" onclick="move(-1)">⬅️ TRÁI</button>
            <button class="control-btn" onclick="move(1)">PHẢI ➡️</button>
        </div>
    </div>

    <script>
        let lane = 1; // 0: Trái, 1: Giữa, 2: Phải
        let score = 0;
        let rows = [];
        let timer = null;

        function initGame() {
            lane = 1;
            score = 0;
            rows = [
                { obs: [null, '🚧', null], item: ['⭐', null, null] },
                { obs: [null, null, '⚠️'], item: [null, '⭐', null] },
                { obs: ['🚧', null, null], item: [null, null, '⭐'] },
                { obs: [null, '⚠️', null], item: ['⭐', null, null] }
            ];
            render();
            if(timer) clearInterval(timer);
            timer = setInterval(gameLoop, 1100); // Tốc độ chạy tự động
        }

        function gameLoop() {
            // Tạo hàng mới phía trên rơi xuống
            const oList = [null, '🚧', '⚠️', null];
            const iList = ['⭐', null, '🍃', '⭐'];
            
            const newRow = {
                obs: [oList[Math.floor(Math.random()*4)], oList[Math.floor(Math.random()*4)], oList[Math.floor(Math.random()*4)]],
                item: [iList[Math.floor(Math.random()*4)], iList[Math.floor(Math.random()*4)], iList[Math.floor(Math.random()*4)]]
            };

            rows.pop();
            rows.unshift(newRow);

            // Kiểm tra va chạm ở hàng dưới cùng
            const bottom = rows[rows.length - 1];
            if(bottom.obs[lane]) {
                alert("💥 Game Over! Va phải chướng ngại vật. Tổng điểm: " + score);
                initGame();
                return;
            } else if(bottom.item[lane]) {
                score += 10;
                bottom.item[lane] = null; // Ăn xong mất sao
            }

            render();
        }

        function render() {
            const container = document.getElementById('track-container');
            let html = '';

            for(let l = 0; l < 3; l++) {
                let laneContent = '';
                for(let r = 0; r < rows.length; r++) {
                    let cell = '·';
                    if(r === rows.length - 1 && l === lane) {
                        cell = '🏃‍♂️'; // Nhân vật
                    } else if(rows[r].obs[l]) {
                        cell = rows[r].obs[l];
                    } else if(rows[r].item[l]) {
                        cell = rows[r].item[l];
                    }
                    laneContent += `<div style="height: 50px; display:flex; align-items:center; justify-content:center;">${cell}</div>`;
                }
                html += `<div class="lane ${l === lane ? 'active-lane' : ''}">${laneContent}</div>`;
            }

            container.innerHTML = html;
            document.getElementById('score-display').innerText = "⭐ " + score;
        }

        function move(dir) {
            lane = Math.max(0, Math.min(2, lane + dir));
            
            // Check ngay khi bấm đổi làn
            const bottom = rows[rows.length - 1];
            if(bottom.obs[lane]) {
                alert("💥 Game Over! Va phải chướng ngại vật. Tổng điểm: " + score);
                initGame();
                return;
            } else if(bottom.item[lane]) {
                score += 10;
                bottom.item[lane] = null;
            }
            render();
        }

        // Bắt phím mũi tên bàn phím
        window.addEventListener('keydown', (e) => {
            if(e.key === 'ArrowLeft') move(-1);
            if(e.key === 'ArrowRight') move(1);
        });

        // Bắt đầu chạy ngay khi mở web
        initGame();
    </script>
</body>
</html>
