<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Eco-Buddy Home Manager ⚡☁️</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #fcf8f2;
            color: #4a3b32;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .vintage-panel {
            background: linear-gradient(145deg, #fffdfa 0%, #f7f1e5 100%);
            border: 2px solid #5c4738;
            box-shadow: 4px 4px 0 #5c4738;
            border-radius: 1.5rem;
            width: 100%;
            max-width: 600px;
            padding: 24px;
        }
        .vint-card {
            background: #fffaf4;
            border: 1.5px solid #5c4738;
            border-radius: 1rem;
            box-shadow: 2px 2px 0 #5c4738;
        }
        .eco-action {
            border: 1.5px solid #6c7957;
            background: #e4ecd9;
            color: #31432f;
            border-radius: 12px;
            padding: 8px 16px;
            font-weight: 900;
            font-size: 12px;
            box-shadow: 0 3px 0 #9cac8d;
            cursor: pointer;
        }
        .eco-action:active { transform: translateY(2px); box-shadow: 0 1px 0 #9cac8d; }
        
        /* Giao diện Làn chạy hỗ trợ cảm ứng vuốt trên điện thoại */
        .eco-playfield {
            border: 2px solid #5c4738;
            border-radius: 18px;
            background: linear-gradient(145deg,#fffaf1,#eee2ce);
            padding: 16px;
            box-shadow: inset 0 1px 4px #fff;
            touch-action: pan-y; /* Cho phép vuốt ngang mượt mà trên mobile */
        }
        .eco-lane {
            min-height: 75px;
            border: 1px dashed #9b896f;
            border-radius: 12px;
            background: #f8f0df;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            transition: all 0.1s ease;
        }
        .eco-lane.active {
            background: #e4ecd9;
            border: 2px solid #54794f;
        }
    </style>
</head>
<body>

    <div class="vintage-panel space-y-4">
        <!-- HEADER TRONG ẢNH -->
        <div class="flex justify-between items-center border-b-2 border-dashed border-[#5c4738] pb-3">
            <div>
                <h2 class="font-black text-lg text-[#4a3b32]">ECO RUNNER</h2>
                <p class="text-xs text-[#7a6452]">Pay Your Bills & Save Energy</p>
            </div>
            <button class="vint-card px-3 py-1.5 text-xs font-bold hover:bg-[#f1e6d8]">📖 Hướng dẫn</button>
        </div>

        <!-- SỐ DƯ XU -->
        <div class="vint-card p-3 text-center">
            <span class="text-xs font-extrabold text-[#7a6452]">Số dư xu tiết kiệm tích lũy:</span>
            <div class="text-lg font-black text-[#5c4738] mt-0.5">🪙 <span id="coin-balance">0</span></div>
        </div>

        <!-- DANH SÁCH THÁNG -->
        <div class="space-y-2.5">
            <p class="text-xs font-bold text-[#5c4738]">📅 CHỌN THÁNG THANH TOÁN HÓA ĐƠN:</p>
            
            <div class="vint-card p-3 flex items-center justify-between">
                <div>
                    <p class="text-xs font-bold text-[#4a3b32]">Tháng 1 (Tết Nguyên Đán)</p>
                    <p class="text-[10px] text-[#7a6452]">Mục tiêu: 800đ | Thưởng: 🪙50</p>
                </div>
                <div class="flex items-center gap-2">
                    <span class="text-[10px] font-bold text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded-full border border-emerald-200">✨ sẵn sàng</span>
                    <button class="eco-action" onclick="startRunnerGame('Tháng 1')">Chạy 🏃</button>
                </div>
            </div>

            <!-- NÚT CHẠY TỰ DO -->
            <button onclick="startRunnerGame('Chạy Tự Do')" class="w-full vint-card p-3 text-center bg-[#e4ecd9] hover:bg-[#d8e4cb] font-extrabold text-xs text-[#31432f] border-2 border-[#5c4738] shadow-[2px_2px_0px_#5c4738] transition">
                ♾️ Chế độ Chạy Tự Do (Endless Runner)
            </button>
        </div>

        <!-- KHUNG CHƠI GAME (Sẽ hiện ra khi bấm Chạy) -->
        <div id="game-stage-container" class="hidden space-y-3 pt-2">
            <div class="flex justify-between items-center text-xs font-black">
                <span id="game-mode-title">🏃 CHẾ ĐỘ CHƠI</span>
                <span id="runner-score">⭐ 0 / 8</span>
            </div>
            <p class="text-[11px] text-[#7a6452] font-semibold text-center">👉 <b>Vuốt màn hình sang Trái / Phải</b> trên điện thoại để né chướng ngại vật!</p>
            
            <!-- Khu vực vuốt cảm ứng (Swipe Box) -->
            <div class="eco-playfield" id="swipe-playfield">
                <div id="runner-lanes" class="grid grid-cols-3 gap-2">
                    <div class="eco-lane">🌿</div>
                    <div class="eco-lane active">🏃</div>
                    <div class="eco-lane">⚡</div>
                </div>
            </div>

            <div class="flex justify-between">
                <button class="eco-action text-xs" onclick="closeRunnerGame()">✕ Thoát</button>
                <div class="flex gap-2">
                    <button class="eco-action" onclick="moveEcoRunner(-1)">⬅️ Trái</button>
                    <button class="eco-action" onclick="moveEcoRunner(1)">Phải ➡️</button>
                </div>
            </div>
        </div>
    </div>

    <!-- JAVASCRIPT LOGIC CHUẨN CODE CŨ + VUỐT MOBILE -->
    <script>
        let ecoRunnerPos = 1; 
        let ecoRunnerStep = 0; 
        let ecoGameScore = 0;

        function startRunnerGame(modeName) {
            document.getElementById('game-stage-container').classList.remove('hidden');
            document.getElementById('game-mode-title').innerText = "🏃 " + modeName;
            ecoRunnerPos = 1; 
            ecoRunnerStep = 0; 
            ecoGameScore = 0;
            drawEcoRunner();
        }

        function closeRunnerGame() {
            document.getElementById('game-stage-container').classList.add('hidden');
        }

        function drawEcoRunner() {
            const lanes = document.getElementById("runner-lanes");
            if(!lanes) return;

            const hazards = ["🧺","💡","🔌","🚿","🧊","📺","🌀","🧯"];
            const safe = ["🌱","⭐","🍃","🌞","🌿","💚","🌻","🌳"];
            const target = ecoRunnerStep % 3;

            const items = [0, 1, 2].map((_, i) => i === target ? hazards[ecoRunnerStep % hazards.length] : safe[(ecoRunnerStep + i) % safe.length]);
            items[ecoRunnerPos] = "🏃";

            lanes.innerHTML = items.map((v, i) => `
                <div class="eco-lane ${i === ecoRunnerPos ? 'active' : ''}">
                    ${v}
                </div>
            `).join("");
        }

        function moveEcoRunner(dir) {
            ecoRunnerPos = Math.max(0, Math.min(2, ecoRunnerPos + dir));
            ecoRunnerStep++;
            ecoGameScore++;
            
            const score = document.getElementById("runner-score");
            if(score) score.innerText = "⭐ " + ecoGameScore + " / 8";
            
            drawEcoRunner();
        }

        // --- TÍNH NĂNG VUỐT TAY TRÁI / PHẢI TRÊN ĐIỆN THOẠI ---
        let touchStartX = 0;
        let touchEndX = 0;
        const playfield = document.getElementById('swipe-playfield');

        playfield.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
        }, {passive: true});

        playfield.addEventListener('touchend', (e) => {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipeGesture();
        }, {passive: true});

        function handleSwipeGesture() {
            const minSwipeDistance = 35; // Khoảng cách tối thiểu để nhận diện vuốt
            if (touchEndX < touchStartX - minSwipeDistance) {
                // Vuốt sang trái
                moveEcoRunner(-1);
            } else if (touchEndX > touchStartX + minSwipeDistance) {
                // Vuốt sang phải
                moveEcoRunner(1);
            }
        }

        // Hỗ trợ cả bàn phím máy tính
        window.addEventListener('keydown', (e) => {
            if(document.getElementById('game-stage-container').classList.contains('hidden')) return;
            if(e.key === 'ArrowLeft') moveEcoRunner(-1);
            if(e.key === 'ArrowRight') moveEcoRunner(1);
        });
    </script>
</body>
</html>
