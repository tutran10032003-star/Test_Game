<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nhà Trọ Xanh Trong Mơ - Eco Cozy Room</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #f7f4ea;
            color: #3b302a;
            user-select: none;
            -webkit-user-select: none;
        }
        .vintage-card {
            background-color: #fdfbf7;
            border: 3px double #8c7355;
            box-shadow: 4px 4px 0px rgba(140, 115, 85, 0.3);
            border-radius: 14px;
        }
        .vintage-btn {
            background-color: #e6dfcd;
            border: 2px solid #5c4738;
            box-shadow: 3px 3px 0px #5c4738;
            transition: all 0.1s ease;
            font-weight: 700;
        }
        .vintage-btn:hover:not(:disabled) {
            background-color: #d8ceb8;
            transform: translate(-1px, -1px);
            box-shadow: 4px 4px 0px #5c4738;
        }
        .vintage-btn:active:not(:disabled) {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px #5c4738;
        }
        /* Grid phòng trọ */
        .room-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 8px;
            background-color: #ebdccb;
            border: 3px solid #5c4738;
            border-radius: 12px;
        }
        .room-cell {
            background-color: #f7f2e2;
            border: 2px dashed #d4c7b0;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            cursor: pointer;
            transition: all 0.2s;
            min-height: 65px;
        }
        .room-cell:hover {
            background-color: #eae1cd;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-3">

    <div class="w-full max-w-md mx-auto vintage-card p-4 flex flex-col items-center relative overflow-hidden">
        
        <!-- HEADER: THÔNG TIN TIỀN TỆ & CHỈ SỐ XANH -->
        <div class="w-full flex justify-between items-center mb-3 border-b-2 border-dashed border-[#8c7355] pb-2">
            <div>
                <h1 class="font-black text-base text-[#4a3b32]" style="font-family: 'Playfair Display', serif;">🏡 NHÀ TRỌ XANH</h1>
                <p class="text-[10px] text-[#735d4c] font-semibold">Trang trí phòng trọ sinh thái & Chữa lành</p>
            </div>
            <div class="flex items-center gap-2">
                <!-- Xu Xanh -->
                <div class="bg-[#f2ecdc] px-2.5 py-1 rounded-xl border border-[#c4b59d] flex items-center gap-1 text-xs font-bold text-[#8c4a32]">
                    <span>🪙</span> <span id="coins-display">350</span>
                </div>
            </div>
        </div>

        <!-- THANH CHỈ SỐ (THẨM MỸ & SINH THÁI) -->
        <div class="w-full grid grid-cols-2 gap-2 mb-3">
            <div class="bg-[#f2ecdc] p-2 rounded-xl border border-[#c4b59d] text-xs font-bold flex items-center justify-between">
                <span class="text-[#5c4738]">🛋️ Ấm Cúng:</span>
                <span id="cozy-score" class="text-[#2c4a1d]">0 đ</span>
            </div>
            <div class="bg-[#f2ecdc] p-2 rounded-xl border border-[#c4b59d] text-xs font-bold flex items-center justify-between">
                <span class="text-[#5c4738]">🌿 Chỉ Số Xanh:</span>
                <span id="eco-score" class="text-[#0284c7]">0 %</span>
            </div>
        </div>

        <!-- KHU VỰC PHÒ TRỌ (LƯỚI 4x4) -->
        <div class="w-full aspect-square room-grid p-2 mb-3 relative" id="room-board">
            <!-- 16 Ô trống trong phòng -->
            <div class="room-cell" onclick="cellClicked(0)" id="cell-0"></div>
            <div class="room-cell" onclick="cellClicked(1)" id="cell-1"></div>
            <div class="room-cell" onclick="cellClicked(2)" id="cell-2"></div>
            <div class="room-cell" onclick="cellClicked(3)" id="cell-3"></div>
            <div class="room-cell" onclick="cellClicked(4)" id="cell-4"></div>
            <div class="room-cell" onclick="cellClicked(5)" id="cell-5"></div>
            <div class="room-cell" onclick="cellClicked(6)" id="cell-6"></div>
            <div class="room-cell" onclick="cellClicked(7)" id="cell-7"></div>
            <div class="room-cell" onclick="cellClicked(8)" id="cell-8"></div>
            <div class="room-cell" onclick="cellClicked(9)" id="cell-9"></div>
            <div class="room-cell" onclick="cellClicked(10)" id="cell-10"></div>
            <div class="room-cell" onclick="cellClicked(11)" id="cell-11"></div>
            <div class="room-cell" onclick="cellClicked(12)" id="cell-12"></div>
            <div class="room-cell" onclick="cellClicked(13)" id="cell-13"></div>
            <div class="room-cell" onclick="cellClicked(14)" id="cell-14"></div>
            <div class="room-cell" onclick="cellClicked(15)" id="cell-15"></div>
        </div>

        <!-- BẢNG CHỌN ĐỒ NỘI THẤT (CỬA HÀNG SHOP) -->
        <div class="w-full bg-[#f2ecdc] p-3 rounded-xl border border-[#c4b59d]">
            <p class="text-xs font-bold text-[#5c4738] mb-2">🛒 Chọn nội thất đặt vào phòng:</p>
            <div class="grid grid-cols-4 gap-2" id="shop-items-container">
                <!-- Đồ nội thất được tạo bằng JS -->
            </div>
        </div>

        <!-- NÚT THU THÊM XU -->
        <button onclick="collectRent()" class="w-full mt-3 vintage-btn py-2.5 rounded-xl text-xs bg-[#d4e4bc] text-[#2c4a1d] font-bold flex items-center justify-center gap-1.5">
            📥 Thu Tiền Thuê Trọ Hàng Ngày (+50 Xu)
        </button>

    </div>

    <script>
        // Dữ liệu tiền & điểm
        let coins = 350;
        let selectedFurniture = null; // Đồ đang chọn để đặt vào phòng
        let roomData = Array(16).fill(null); // Trạng thái 16 ô trong phòng

        // Danh sách đồ nội thất có thể mua và đặt
        const shopItems = [
            { id: 'plant', name: 'Chậu cây', icon: '🪴', price: 50, cozy: 15, eco: 20 },
            { id: 'bed', name: 'Giường gỗ', icon: '🛏️', price: 120, cozy: 40, eco: 10 },
            { id: 'lamp', name: 'Đèn LED', icon: '💡', price: 80, cozy: 25, eco: 15 },
            { id: 'rug', name: 'Thảm dệt', icon: '🧶', price: 60, cozy: 20, eco: 5 },
            { id: 'desk', name: 'Bàn trà', icon: '🪵', price: 100, cozy: 30, eco: 10 },
            { id: 'cat', name: 'Mèo lười', icon: '🐱', price: 150, cozy: 60, eco: 0 },
            { id: 'window', name: 'Cửa sổ', icon: '🪟', price: 90, cozy: 20, eco: 30 },
            { id: 'shelf', name: 'Kệ sách', icon: '📚', price: 110, cozy: 35, eco: 10 }
        ];

        // Khởi tạo cửa hàng shop
        function renderShop() {
            const container = document.getElementById('shop-items-container');
            container.innerHTML = '';

            shopItems.forEach((item, index) => {
                let isSelected = selectedFurniture && selectedFurniture.id === item.id;
                let borderStyle = isSelected ? 'border-2 border-[#8c4a32] bg-[#f5e1a4]' : 'border border-[#d4c7b0] bg-[#fdfbf7]';

                let div = document.createElement('div');
                div.className = `p-2 rounded-xl flex flex-col items-center justify-center cursor-pointer ${borderStyle} shadow-sm`;
                div.onclick = () => selectFurniture(item);
                div.innerHTML = `
                    <span class="text-xl">${item.icon}</span>
                    <span class="text-[10px] font-bold text-[#5c4738] mt-1">${item.price}🪙</span>
                `;
                container.appendChild(div);
            });
        }

        function selectFurniture(item) {
            if (coins < item.price) {
                alert("⚠️ Không đủ Xu Xanh để mua món đồ này! Hãy bấm thu tiền trọ nhé.");
                return;
            }
            selectedFurniture = item;
            renderShop();
        }

        // Khi bấm vào ô trong phòng trọ
        function cellClicked(index) {
            if (!selectedFurniture) {
                alert("👉 Vui lòng chọn một món đồ nội thất ở bên dưới trước khi đặt vào phòng!");
                return;
            }

            if (roomData[index] !== null) {
                alert("⚠️ Ô này đã có đồ vật rồi! Hãy chọn ô trống khác.");
                return;
            }

            // Trừ tiền và đặt đồ vào ô
            coins -= selectedFurniture.price;
            roomData[index] = selectedFurniture;
            selectedFurniture = null; // Bỏ chọn sau khi đặt xong

            updateUI();
            renderShop();
            renderRoom();
        }

        // Vẽ lại không gian phòng trọ
        function renderRoom() {
            roomData.forEach((item, index) => {
                let cell = document.getElementById(`cell-${index}`);
                if (item) {
                    cell.innerText = item.icon;
                    cell.style.backgroundColor = '#f3eedf';
                } else {
                    cell.innerText = '';
                    cell.style.backgroundColor = '#f7f2e2';
                }
            });
        }

        // Tính toán lại chỉ số Ấm cúng và Xanh
        function updateStats() {
            let totalCozy = 0;
            let totalEco = 0;

            roomData.forEach(item => {
                if (item) {
                    totalCozy += item.cozy;
                    totalEco += item.eco;
                }
            });

            document.getElementById('coins-display').innerText = coins;
            document.getElementById('cozy-score').innerText = `${totalCozy} đ`;
            document.getElementById('eco-score').innerText = `${Math.min(100, totalEco)} %`;
        }

        function updateUI() {
            updateStats();
        }

        // Nhận xu hàng ngày
        function collectRent() {
            coins += 50;
            updateUI();
            alert("🎉 Đã thu 50 Xu Xanh từ tiền thuê phòng trọ!");
        }

        // Khởi động chạy lần đầu
        renderShop();
        updateUI();
    </script>
</body>
</html>
